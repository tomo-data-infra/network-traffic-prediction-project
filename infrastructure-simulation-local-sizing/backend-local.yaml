# REQUIRED before kubectl apply: the host-built image must exist inside Minikube's own
# Docker daemon, which is separate from your host's Docker daemon -- imagePullPolicy: Never
# will NOT pull it from anywhere, it only uses what's already cached inside Minikube.
#   minikube image load netops-backend:local
#
# DB_HOST resolution -- verify BEFORE trusting this manifest, don't assume:
# Primary approach below uses host.minikube.internal, Minikube's own built-in DNS name for
# reaching the host machine (resolved via CoreDNS, present since minikube v1.10). There is a
# documented failure mode for this exact combination -- Docker driver on WSL2 -- where the
# name resolves but traffic doesn't actually route (kubernetes/minikube#15224). Your own
# docker run --add-host=host.docker.internal:host-gateway tests already proved
# host.docker.internal works in this environment, so that's the fallback if the primary
# approach fails the verification step below.
#
# Verify primary approach first:
#   kubectl run dns-test --rm -it --image=busybox:1.36 --restart=Never -n sizing-test -- \
#     sh -c "nslookup host.minikube.internal && wget -T 3 -qO- host.minikube.internal:5432 || true"
#   (a DNS answer plus some TCP-level response/refusal on :5432, rather than a timeout,
#   means it's actually routing -- Postgres will reject the wget handshake, that's expected
#   and still proves the network path works)
#
# If that fails to route (resolves but times out), use the fallback instead: get the real
# gateway IP and pin it via hostAliases rather than relying on the magic DNS name:
#   minikube ssh -- ip route show default
# then uncomment the hostAliases block below, replace GATEWAY_IP, and change DB_HOST to
# host.docker.internal (matching the name your proven docker run commands used).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: netops-backend-sizing
  namespace: sizing-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netops-backend-sizing
  template:
    metadata:
      labels:
        app: netops-backend-sizing
    spec:
      # Fallback only -- uncomment if the DB_HOST verification step above shows
      # host.minikube.internal resolves but doesn't route:
      # hostAliases:
      #   - ip: "GATEWAY_IP"
      #     hostnames:
      #       - "host.docker.internal"
      containers:
        - name: backend-api
          image: netops-backend:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: "host.minikube.internal"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: sizing-test-db-env
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: sizing-test-db-env
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sizing-test-db-env
                  key: DB_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sizing-test-db-env
                  key: SECRET_KEY
            - name: ALLOWED_HOSTS
              value: "*"
            - name: CORS_ALLOWED_ORIGINS
              # Comma-separated, no spaces -- config/settings.py:118 just does .split(','),
              # so a stray space would become part of an origin string and fail to match.
              # 192.168.49.2 is Minikube's commonly-seen default docker-driver IP, but it's
              # not guaranteed stable -- verify with `minikube ip` and adjust this value if
              # it differs before relying on it.
              value: "http://localhost:30173,http://localhost:5173,http://192.168.49.2:30173"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sizing-test-db-env
                  key: GEMINI_API_KEY
                  optional: true
            # optional: true so a missing key doesn't crash the pod -- but if ADMIN_PASSWORD
            # isn't actually in your .env (and therefore not in the sizing-test-db-env Secret),
            # AdminLoginView (calendar_api/views.py) treats it as unset and every login attempt
            # gets 401 regardless of password typed. Needed for the frontend+backend login
            # check before the stress test -- confirm the key exists in .env if login still fails.
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sizing-test-db-env
                  key: ADMIN_PASSWORD
                  optional: true
            - name: OLLAMA_API_URL
              value: "host.minikube.internal:11434/api/generate"
          # Intentionally no resources: requests/limits here -- this Deployment exists to
          # MEASURE real CPU/RAM consumption under load (via kubectl top pods), not to
          # constrain it against a guess made before any data exists. Add requests/limits to
          # the real infrastructure-simulation/ manifests afterward, based on what's observed.
---
apiVersion: v1
kind: Service
metadata:
  name: netops-backend-sizing
  namespace: sizing-test
spec:
  type: NodePort
  selector:
    app: netops-backend-sizing
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
