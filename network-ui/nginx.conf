server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Client-side routing fallback -- any path that isn't a real static file falls
    # back to index.html so React can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
