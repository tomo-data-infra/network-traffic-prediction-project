# ATTEMPTED AND ABANDONED ON MINIKUBE -- kept as a documented record of what was tried, not
# as something you can apply successfully here. Applying this manifest produces two failures:
#
# 1. RBAC gap: the ClusterRole below is missing `namespaces` (core API group) and
#    `daemonsets` (apps API group) in its watch/list/get rules, so the pod logs
#    "...is forbidden: ...cannot list resource ... at the cluster scope" for both.
#    Fixable, but moot given #2.
#
# 2. FATAL, not fixable by RBAC patching: this manifest runs the real upstream
#    cluster-autoscaler binary with --cloud-provider=gce, which queries GCP's instance
#    metadata server (169.254.169.254) to self-identify its project/zone/credentials before
#    talking to the real GCE Compute API to add/remove VMs. A Minikube node is a Docker
#    container on your own machine, not a GCE VM -- that address doesn't exist here, so the
#    pod crashes immediately: "Failed to create GCE Manager: ... dial tcp 169.254.169.254:80:
#    connect: no route to host". There is no cloud-provider flag that makes this work against
#    Minikube, because Minikube has no cloud API to provision real nodes against at all.
#
# Also checked and confirmed absent: Minikube's own native addon for this
# (`minikube addons enable cluster-autoscaler`) -- verified via `minikube addons list`
# returning nothing for it. That addon only exists in an unmerged, draft,
# "do-not-merge/work-in-progress" upstream PR (kubernetes/minikube#23809) as of this writing.
#
# Decision: stop chasing a working local Cluster Autoscaler simulation. The real
# implementation path is a real GKE node pool -- see README.md's "Future work: pairing HPA
# with a real Cluster Autoscaler (GKE)" section.
#
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
  name: cluster-autoscaler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
rules:
  - apiGroups: [""]
    resources: ["events", "endpoints", "configmaps"] # Added configmaps for status updates
    verbs: ["create", "patch", "get", "update", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["endpoints"]
    resourceNames: ["cluster-autoscaler"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["watch", "list", "get", "update"]
  - apiGroups: ["", "apps"]
    resources: ["pods", "services", "replicationcontrollers", "persistentvolumeclaims", "persistentvolumes", "replicasets", "statefulsets"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["watch", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "csidrivers", "csistoragecapacities"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["batch", "extensions"]
    resources: ["jobs"]
    verbs: ["watch", "list", "get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resourceNames: ["cluster-autoscaler"]
    resources: ["leases"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
  labels:
    k8s-addon: cluster-autoscaler.addons.k8s.io
    k8s-app: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
  labels:
    app: cluster-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-autoscaler
  template:
    metadata:
      labels:
        app: cluster-autoscaler
    spec:
      serviceAccountName: cluster-autoscaler
      containers:
        # Changed to dynamic local-testing image that natively supports cluster-proportional scaling
        - image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.28.2
          name: cluster-autoscaler
          resources:
            limits:
              cpu: 100m
              memory: 300Mi
            requests:
              cpu: 100m
              memory: 300Mi
          command:
            - ./cluster-autoscaler
            - --v=4
            - --stderrthreshold=info
            # Switch to 'gce' (or target environment syntax) or let minikube hook its cluster control loop natively via standard API access.
            - --cloud-provider=gce
            - --nodes=1:5:minikube
            - --scale-down-unneeded-time=3m
