apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: netops-frontend-hpa
  namespace: prod-customer-alpha
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: netops-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
