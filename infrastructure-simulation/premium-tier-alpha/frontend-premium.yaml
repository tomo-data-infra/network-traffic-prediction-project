apiVersion: apps/v1
kind: Deployment
metadata:
  name: netops-frontend
  namespace: prod-customer-alpha
spec:
  replicas: 3
  selector:
    matchLabels:
      app: netops-frontend
  template:
    metadata:
      labels:
        app: netops-frontend
    spec:
      # Spread replicas across different nodes where possible, so a single node
      # failure doesn't take down every frontend replica at once. Only has an
      # effect if Minikube is started with more than one node
      # (minikube start --nodes=2); on a single node it's a harmless no-op.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: netops-frontend
                topologyKey: kubernetes.io/hostname
      containers:
      - name: ui-container
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          # Measured empirically against the real netops-frontend:local image (nginx serving
          # the built React bundle) under Locust load on Minikube: CPU stayed under 50m and
          # RAM under 10Mi even at 200 concurrent users -- static-asset serving is essentially
          # flat across that range.
          # NOTE: the container above is still the nginx:alpine placeholder, not the real
          # built image -- see README's production-readiness checklist.
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
