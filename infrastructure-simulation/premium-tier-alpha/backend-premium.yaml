apiVersion: apps/v1
kind: Deployment
metadata:
  name: netops-backend
  namespace: prod-customer-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netops-backend
  template:
    metadata:
      labels:
        app: netops-backend
    spec:
      containers:
      - name: backend-api
        image: python:3.11-slim
        # NOTE: this is a placeholder standing in for the real Django API while
        # this simulation validates namespace/replica/Service/NetworkPolicy
        # topology -- it is not the actual calendar_api backend. Porting the
        # real Django image (plus its Postgres/Cube.js/Ollama dependencies)
        # into this cluster is the natural next step, not yet done here.
        command: ["sh", "-c"]
        args:
          - |
            mkdir -p /srv/www && \
            printf '{"tier": "premium", "namespace": "prod-customer-alpha", "role": "backend-placeholder"}' > /srv/www/index.json && \
            cd /srv/www && python -u -m http.server 8000
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "64Mi"
        readinessProbe:
          httpGet:
            path: /index.json
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /index.json
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
