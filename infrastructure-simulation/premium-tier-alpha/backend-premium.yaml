apiVersion: apps/v1
kind: Deployment
metadata:
  name: netops-backend
  namespace: prod-customer-alpha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netops-backend
  template:
    metadata:
      labels:
        app: netops-backend
    spec:
      containers:
      - name: backend-api
        image: python:3.11-slim
        # NOTE: this is a placeholder standing in for the real Django API while
        # this simulation validates namespace/replica/Service/NetworkPolicy
        # topology -- it is not the actual calendar_api backend. Porting the
        # real Django image (plus its Postgres/Cube.js/Ollama dependencies)
        # into this cluster is the natural next step, not yet done here.
        command: ["sh", "-c"]
        args:
          - |
            mkdir -p /srv/www && \
            printf '{"tier": "premium", "namespace": "prod-customer-alpha", "role": "backend-placeholder"}' > /srv/www/index.json && \
            cd /srv/www && python -u -m http.server 8000
        ports:
        - containerPort: 8000
        resources:
          # Measured empirically against the real netops-backend:local image under Locust
          # load on Minikube (infrastructure-simulation-local-sizing/), not guessed: steady
          # state climbed to 2.0-2.41 cores at 10 concurrent users hitting /api/ping_data/
          # (in-process NumPy aggregation + forecasting), RAM plateaued around 320Mi.
          # NOTE: the container above is still the python:3.11-slim placeholder, not the real
          # Django image -- these numbers are sized for when that gets wired in (see README's
          # production-readiness checklist), not for the current stub's own footprint.
          # On e2-medium (2 vCPU), this request (800m) exceeds the ~650m real usable budget
          # per node after GKE's reservation + DaemonSet overhead -- see README's GKE findings
          # section. A pod this size needs e2-standard-4 or larger, not e2-medium.
          requests:
            cpu: "800m"
            memory: "320Mi"
          limits:
            cpu: "2500m"
            memory: "450Mi"
        readinessProbe:
          httpGet:
            path: /index.json
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /index.json
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
